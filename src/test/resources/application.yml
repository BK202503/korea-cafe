spring:
  datasource:
    url: jdbc:h2:mem:cafe;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

naver:
  local-search:
    base-url: https://openapi.naver.com
    client-id:
    client-secret:
